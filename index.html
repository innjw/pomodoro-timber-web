<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div class="container">
    <h1>pomodoro</h1>

    <div class="timer">
      <span class="time">25:00</span>
    </div>

    <div class="controls">
      <button class="btn btn-start">시작</button>
      <button class="btn btn-stop">정지</button>
      <button class="btn btn-reset">초기화</button>
    </div>

    <div class="current-time" id="currentTime"></div>
    <a href="setting.html" class="btn-settings">⚙ 설정</a>
  </div>
  <script src="index.js"></script>
  <script>
    function updateTime() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('currentTime').textContent = `${h}:${m}:${s}`;
    }
    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
